[pytest]
testpaths = tests
# The library is imported from the repo root, not installed, so tests run
# against the working tree without needing `pip install -e .` first.
pythonpath = .
addopts = -ra
markers =
    network: hits the live Ensembl or UCSC APIs; excluded from the default run
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
