[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rs3"
dynamic = ["version"]
description = "Predict the activity of CRISPR sgRNAs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Peter Deweirdt", email = "petedeweirdt@gmail.com"}]
keywords = ["rs3", "CRISPR", "sgrna"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "joblib>=1.3",
    "pandas>=2.0",
    "lightgbm>=4.0",
    "sglearn>=1.2.5",
    "tqdm>=4.64",
    "pyarrow>=14",
    "biopython>=1.81",
    "requests>=2.28",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "gpplot>=0.5.0",
    "seaborn>=0.13",
    "scipy>=1.11",
    "jupyterlab>=4.0",
    "nbdev>=3.0",
    "matplotlib>=3.8",
    "tabulate>=0.9",
    "pytest>=8.0",
]

[project.urls]
Repository = "https://github.com/gpp-rnd/rs3"
Documentation = "https://gpp-rnd.github.io/rs3/"

[project.entry-points.nbdev]
rs3 = "rs3._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "rs3.__version__"}

[tool.setuptools.packages.find]
include = ["rs3"]

# Required explicitly. The models are data files inside the package, and relying on
# include-package-data plus MANIFEST.in populates the sdist but is easy to get wrong
# for the wheel -- which is what users actually install.
[tool.setuptools.package-data]
rs3 = ["*.txt", "*.json"]

[tool.nbdev]
nbs_path = '.'
doc_path = '_docs'
lib_path = 'rs3'
branch = 'master'
recursive = false
readme_nb = 'index.ipynb'
title = 'rs3'

[tool.pytest.ini_options]
testpaths = ["tests"]
# The library is imported from the repo root, not installed, so tests run against
# the working tree without needing `pip install -e .` first.
pythonpath = ["."]
addopts = "-ra"
markers = [
    "network: hits the live Ensembl or UCSC APIs; excluded from the default run",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
